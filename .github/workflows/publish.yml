name: Publish Posts

on:
  push:
    branches: [Dev]
    paths:
      - 'src/content/posts/**'

permissions:
  contents: write   # para commitear el devtoId de vuelta al frontmatter
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install PyYAML requests

      - name: Publish newly-published posts
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_posts.py

      - name: Commit Dev.to article ids back to frontmatter
        run: |
          if [ -n "$(git status --porcelain src/content/posts)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/content/posts
            git commit -m "chore: store dev.to article ids [skip ci]"
            git push origin HEAD:Dev
          fi
